[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output with short traceback
addopts = -v --tb=short --strict-markers -ra

# Custom markers
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (may need database, external APIs mocked)
    e2e: End-to-end tests (full system, real connections)
    slow: Slow tests (>1s execution time)
    mt5: Tests requiring MT5 connection

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum coverage (optional, requires pytest-cov)
# addopts = --cov=python --cov-report=html --cov-fail-under=70

# Test timeout (optional, requires pytest-timeout)
# timeout = 30
